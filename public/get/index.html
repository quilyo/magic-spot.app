<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagicSpot — Get the App</title>
<meta name="description" content="Real-time street parking availability across New York City. Download the app or use the web version.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#E8281E;--red-dark:#B81F16;
  --black:#0A0A0A;
  --surface:#1E1E1E;--surface2:#272727;
  --border:rgba(255,255,255,0.08);--border-red:rgba(232,40,30,0.22);
  --text:#F0EDE8;--text2:#9A9087;
  --radius:16px;
}
html{height:100%;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--black);
  color:var(--text);
  min-height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
  position:relative;
  overflow-x:hidden;
}

/* Red ambient glow */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 50% -5%, rgba(232,40,30,0.15) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 85% 90%, rgba(232,40,30,0.06) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:440px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:48px 40px;
  text-align:center;
  box-shadow:0 0 0 1px rgba(232,40,30,0.08), 0 40px 100px rgba(0,0,0,0.6);
}

/* Logo */
.logo-wrap{
  display:flex;align-items:center;justify-content:center;
  gap:14px;
  margin-bottom:20px;
}
.logo-img{
  width:56px;height:56px;
  border-radius:14px;
  object-fit:contain;
  box-shadow:0 0 28px rgba(232,40,30,0.3);
}
.brand{
  font-family:'Bebas Neue',sans-serif;
  font-size:38px;
  letter-spacing:3px;
  color:var(--text);
  line-height:1;
}
.brand span{color:var(--red);}

.tagline{
  font-size:15px;
  font-weight:300;
  color:var(--text2);
  margin-bottom:10px;
  line-height:1.5;
}

/* Live badge */
.badge{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(232,40,30,0.1);
  border:1px solid rgba(232,40,30,0.3);
  border-radius:50px;
  padding:5px 14px;
  font-size:12px;font-weight:500;
  color:var(--red);
  margin-bottom:36px;
}
.pulse{
  width:6px;height:6px;border-radius:50%;
  background:var(--red);
  animation:blink 2s infinite;
}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.35;transform:scale(0.7);}}

/* Divider */
.divider{
  display:flex;align-items:center;gap:12px;
  margin:24px 0;
}
.divider-line{flex:1;height:1px;background:var(--border);}
.divider-text{font-size:11px;font-weight:500;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}

/* Buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;
  padding:16px 24px;
  border-radius:var(--radius);
  font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:600;
  text-decoration:none;
  border:none;cursor:pointer;
  transition:transform 0.15s, box-shadow 0.2s, background 0.2s;
  margin-bottom:12px;
}
.btn:last-child{margin-bottom:0;}
.btn:active{transform:scale(0.97);}

.btn-apple{
  background:#000;color:#fff;
  border:1px solid rgba(255,255,255,0.12);
}
.btn-apple:hover{background:#111;box-shadow:0 8px 32px rgba(0,0,0,0.5);}

.btn-google{
  background:#fff;color:#111;
}
.btn-google:hover{background:#f5f5f5;box-shadow:0 8px 32px rgba(0,0,0,0.3);}

.btn-web{
  background:transparent;
  color:var(--text);
  border:1px solid rgba(255,255,255,0.15);
}
.btn-web:hover{border-color:var(--red);color:var(--red);box-shadow:0 0 20px rgba(232,40,30,0.12);}

.btn-text{text-align:left;}
.btn-sub{display:block;font-size:10px;font-weight:400;opacity:0.65;margin-bottom:1px;}
.btn-main{display:block;font-size:16px;font-weight:600;}

/* Footer */
.footer{
  margin-top:32px;
  font-size:11px;
  color:rgba(154,144,135,0.45);
  line-height:1.6;
}
.footer a{color:rgba(154,144,135,0.6);text-decoration:none;}
.footer a:hover{color:var(--red);}

@media(max-width:480px){
  .card{padding:36px 24px;}
  .brand{font-size:32px;}
}
</style>
</head>
<body>
<div class="card">

  <!-- Logo + Brand -->
  <div class="logo-wrap">
    <img src="/logo.png" alt="MagicSpot logo" class="logo-img">
    <div class="brand">Magic<span>Spot</span></div>
  </div>

  <p class="tagline">Real-time street parking availability<br>across New York City.</p>

  <div class="badge">
    <span class="pulse"></span>
    Live parking data
  </div>

  <!-- App Store -->
  <a href="https://apps.apple.com/us/app/magic-spot/id6762166928" target="_blank" rel="noopener noreferrer" class="btn btn-apple">
    <svg width="26" height="26" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true">
      <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
    </svg>
    <div class="btn-text">
      <span class="btn-sub">Download on the</span>
      <span class="btn-main">App Store</span>
    </div>
  </a>

  <!-- Google Play -->
  <a href="https://play.google.com/store/apps/details?id=com.magicspot.app&pli=1" target="_blank" rel="noopener noreferrer" class="btn btn-google">
    <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#4CAF50" d="M7.5 4.1C7.05 4.35 6.67 4.74 6.47 5.27L24.24 23.09l6.02-6.02L7.5 4.1z"/>
      <path fill="#FF3D00" d="M41.16 21.52l-5.87-3.28-6.63 6.63 6.63 6.63 5.92-3.3C42.81 27.28 42.81 24.44 41.16 21.52z"/>
      <path fill="#FFC107" d="M6.47 42.73c.2.53.58.92 1.03 1.16L30.26 30.93l-6.02-6.02L6.47 42.73z"/>
      <path fill="#1976D2" d="M24.24 24L6.47 5.27C6.67 4.74 7.05 4.35 7.5 4.1L30.26 17.07 24.24 24zM30.26 30.93L7.5 43.89c-.45-.24-.83-.63-1.03-1.16L24.24 24.91l6.02 6.02z"/>
    </svg>
    <div class="btn-text">
      <span class="btn-sub">Get it on</span>
      <span class="btn-main">Google Play</span>
    </div>
  </a>

  <!-- Divider -->
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">or</span>
    <div class="divider-line"></div>
  </div>

  <!-- Web App -->
  <a href="/login" class="btn btn-web">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    Continue to Web App
  </a>

  <div class="footer">
    <a href="/terms/">Terms</a> &nbsp;·&nbsp;
    <a href="/privacy/">Privacy</a>
    <br>MagicSpot — Real-time Parking Monitoring
  </div>

</div>
</body>
</html>
